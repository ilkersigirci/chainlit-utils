[project]
name = "chainlit-utils"
version = "0.1.0"
description = "Reusable persistence and chat helpers for Chainlit applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [
    { name = "İlker SIĞIRCI", email = "sigirci.ilker@gmail.com" },
]
dependencies = [
    "asyncpg>=0.30.0",
    "chainlit>=2.11.1",
    "openai>=2.0.0",
    "pydantic-settings>=2.9.0",
]

[project.scripts]
chainlit-utils-migrate = "chainlit_utils.database:main"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
test = [
    "anyio>=4",
    "pytest>=8.3.3",
]

[tool.uv]
default-groups = ["dev", "test"]
required-version = ">=0.12.1"

[tool.pytest.ini_options]
minversion = "8.3.3"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PIE", "PTH", "RUF", "SIM", "W"]
ignore = ["E501"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.1,<0.13"]
